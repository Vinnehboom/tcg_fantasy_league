version: 2.1

orbs:
  ruby: circleci/ruby@1.4.0
  node: circleci/node@5.0.0
  browser-tools: circleci/browser-tools@2.4.2

executors:
  lite-container:
    resource_class: small
    docker:
      - image: cimg/base:2022.03
  lite-ruby-container:
    resource_class: small
    docker:
      - image: cimg/ruby:3.3.6
  test-container:
    resource_class: medium
    docker:
      - image: cimg/ruby:3.3.6-browsers
      - image: cimg/postgres:14.0
        environment:
          POSTGRES_USER: tcg_fantasy_draft
          POSTGRES_DB: tcg_fantasy_draft_test
          POSTGRES_PASSWORD: tcg_fantasy_draft
    environment:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      PGHOST: 127.0.0.1
      RAILS_ENV: test

commands:
  db_setup:
    description: >
      Wait for this job's own Postgres service container to accept
      connections, then create and load the test schema. A fresh Postgres
      container is spun up per job, so this can't be shared through the
      workspace persisted by the setup job — only files carry over that way,
      not live service containers.
    steps:
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:create && bundle exec rails db:schema:load --trace

jobs:
  setup:
    executor: test-container
    steps:
      - checkout
      - run:
          name: Fix stale Google Chrome apt key
          command: sudo wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo tee /etc/apt/trusted.gpg.d/google-chrome.asc > /dev/null
      - run: sudo apt update && sudo apt install zlib1g-dev
      - ruby/install-deps
      - run:
          name: Assets precompile
          command: bundle exec rake assets:precompile
      - persist_to_workspace:
          root: .
          paths:
            - .
  test:
    executor: test-container
    steps:
      - attach_workspace:
          at: .
      - db_setup
      - run:
          name: Lint
          command: bundle exec rubocop -P
      - run:
          name: No fixup commits
          command: bin/no-fixups
      - run:
          name: Tests
          command: bundle exec rspec --exclude-pattern "features/**/*_spec.rb"
  feature_specs:
    executor: test-container
    steps:
      - attach_workspace:
          at: .
      # cimg/ruby:*-browsers images DO ship a real Chrome binary — it's
      # baked into the image at build time (see the "Install a single
      # version of Google Chrome Stable" step in
      # https://github.com/CircleCI-Public/cimg-ruby/blob/main/3.3/browsers/Dockerfile),
      # along with its own /etc/apt/sources.list.d/google-chrome.list.
      # `replace_existing: true` here previously forced install_chrome to
      # purge and reinstall that baked-in Chrome, which makes its script
      # append a second, byte-identical `deb ...` line to that same
      # already-populated sources file — apt then refuses to update at all
      # ("Target Packages ... is configured multiple times"), which is what
      # actually failed this job. Leaving replace_existing at its default
      # (false) makes install_chrome recognize Chrome is already present
      # and exit without touching apt/sources.list.d, so it never hits that
      # duplicate-entry error.
      #
      # No install_chromedriver step: this repo's :js driver is Cuprite
      # (see spec/rails_helper.rb), which drives Chrome directly over the
      # DevTools protocol and needs no separate chromedriver binary kept
      # version-matched against it — that's the whole problem Cuprite
      # replaced Selenium+chromedriver to get rid of, so installing a
      # chromedriver here would be dead weight at best.
      - browser-tools/install_chrome
      - run:
          name: Check browser install
          command: google-chrome --version
      - db_setup
      - run:
          name: Tests
          command: bundle exec rspec spec/features

workflows:
  version: 2
  CI:
    jobs:
      - setup:
          filters:
            branches:
              ignore: main
      - test:
          requires:
            - setup
          filters:
            branches:
              ignore: main
      - feature_specs:
          requires:
            - setup
          filters:
            branches:
              ignore: main
