version: 2.1

orbs:
  ruby: circleci/ruby@1.4.0
  node: circleci/node@5.0.0
  browser-tools: circleci/browser-tools@2.4.2

executors:
  lite-container:
    resource_class: small
    docker:
      - image: cimg/base:2022.03
  lite-ruby-container:
    resource_class: small
    docker:
      - image: cimg/ruby:3.3.6
  test-container:
    resource_class: medium
    docker:
      - image: cimg/ruby:3.3.6-browsers
      - image: cimg/postgres:14.0
        environment:
          POSTGRES_USER: tcg_fantasy_draft
          POSTGRES_DB: tcg_fantasy_draft_test
          POSTGRES_PASSWORD: tcg_fantasy_draft
    environment:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      PGHOST: 127.0.0.1
      RAILS_ENV: test

commands:
  db_setup:
    description: >
      Wait for this job's own Postgres service container to accept
      connections, then create and load the test schema. A fresh Postgres
      container is spun up per job, so this can't be shared through the
      workspace persisted by the setup job — only files carry over that way,
      not live service containers.
    steps:
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:create && bundle exec rails db:schema:load --trace

jobs:
  setup:
    executor: test-container
    steps:
      - checkout
      - run:
          name: Fix stale Google Chrome apt key
          command: sudo wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo tee /etc/apt/trusted.gpg.d/google-chrome.asc > /dev/null
      - run: sudo apt update && sudo apt install zlib1g-dev
      - ruby/install-deps
      - run:
          name: Assets precompile
          command: bundle exec rake assets:precompile
      - persist_to_workspace:
          root: .
          paths:
            - .
  test:
    executor: test-container
    steps:
      - attach_workspace:
          at: .
      - db_setup
      - run:
          name: Lint
          command: bundle exec rubocop -P
      - run:
          name: Tests
          command: bundle exec rspec --exclude-pattern "features/**/*_spec.rb"
  feature_specs:
    executor: test-container
    steps:
      - attach_workspace:
          at: .
      # The cimg/*-browsers convenience images ship only the OS-level
      # libraries browsers need, not an actual Chrome binary or a
      # chromedriver matched to one (see
      # https://github.com/CircleCI-Public/browser-tools-orb) — and system
      # package installs from the `setup` job's container don't carry over
      # through persist_to_workspace/attach_workspace (that only copies the
      # `.` checkout, not installed binaries), so every job that drives a
      # real browser has to install its own pair. install_chromedriver
      # dynamically selects the driver version to match whatever Chrome
      # install_chrome just installed, so the two can't drift apart.
      - browser-tools/install_chrome:
          replace_existing: true
      - browser-tools/install_chromedriver
      - run:
          name: Check browser install
          command: |
            google-chrome --version
            chromedriver --version
      - db_setup
      - run:
          name: Tests
          command: bundle exec rspec spec/features

workflows:
  version: 2
  CI:
    jobs:
      - setup:
          filters:
            branches:
              ignore: main
      - test:
          requires:
            - setup
          filters:
            branches:
              ignore: main
      - feature_specs:
          requires:
            - setup
          filters:
            branches:
              ignore: main
