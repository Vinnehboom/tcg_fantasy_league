databases:
  - name: tcg-fantasy-league-production
    databaseName: tcg_fantasy_league
    user: tcg_fantasy_league
    plan: free

services:
  - type: web
    name: tcg_fantasy_league
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    # Migrations run inside the build script: preDeployCommand needs a paid instance type.
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tcg-fantasy-league-production
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      # The site is not public yet, so production sits behind HTTP basic auth.
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: 2 # sensible default