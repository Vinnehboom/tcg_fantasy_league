    privacy:
      title: Privacy notice
      draft_notice: This notice is not final. Bracketed sections will be confirmed before launch.
      controller_heading: Who we are
      controller_name: "[Legal entity name]"
      controller_address: "[Registered address]"
      registration_heading: How we are registered with the ICO
      registration_body: "We are not yet registered with the UK Information Commissioner's Office. [Registration number to be confirmed]"
      contact_heading: How to contact us
      contact_address: "[Contact address for privacy and data-subject requests]"
      data_heading: What data we process
      data_body: We process your account details (email address, username, country, and date of birth), and your activity in salary drafts, rosters, and tournament participations.
      player_information_heading: Players we track
      player_information_body: This notice covers your own account. We also hold data about competitive players who have no account with us. A separate notice covers that data.
      player_information_link: Information for players we track
      purpose_heading: Why we process your data
      purpose_body: We use this data to run your account, run salary drafts and rosters, and show your results and scores.
      lawful_basis_heading: Our lawful basis
      lawful_basis_body: We process your account data to perform our contract with you. We process your activity data because we have a legitimate interest in running the game.
      retention_heading: How long we keep your data
      retention_body: "[retention period to be confirmed]"
      retention_import_logs_body: We keep a log of every import we run from an external service. The raw response in that log holds player names and results. We keep the raw response for 24 hours after the import. A job that runs every hour then erases the raw response. We remove the whole log entry when we no longer need it.
      recipients_heading: Who receives your data
      recipients_body: Render hosts our application and our database. Honeybadger receives our error reports.
      transfers_heading: Transfers outside the UK
      transfers_body: Render and Honeybadger are based in the United States, so using them can mean your data leaves the UK. We only allow this transfer under a lawful safeguard recognised by UK data protection law, such as the UK's International Data Transfer Addendum.
      rights_heading: Your rights
      rights_body: You have the right to access, correct, erase, and port your data. You also have the right to object to some uses of it. To use any of these rights, contact us at the address above.
      complaints_heading: How to complain
      complaints_ico: You can complain to the UK Information Commissioner's Office (ICO) at ico.org.uk.
      complaints_dpo: "[named data protection contact beyond the ICO to be confirmed]"
    player_information:
      title: Information for players we track
      draft_notice: This notice is not final. Bracketed sections will be confirmed before launch.
      intro: We hold data about competitive players. We did not get this data from the players it describes, so this page publishes the information UK GDPR Article 14 requires.
      controller_heading: Who we are
      controller_name: "[Legal entity name]"
      controller_address: "[Registered address]"
      contact_heading: How to contact us
      contact_address: "[Contact address for privacy and data-subject requests]"
      data_heading: What data we hold about you
      data_body: We hold your name, your country, the identifier that the source uses for you, your finishing places in tournaments, and your ranking points or rating over time.
      source_heading: Where the data came from
      source_body: We take Pokémon player data from the public rankings and results of Limitless TCG, at limitlesstcg.com. Every game we add brings its own public source, and we name that source here.
      purpose_heading: Why we use your data
      purpose_body: We run a fantasy game. Our members pick real competitive players, and we score those picks against real tournament results.
      lawful_basis_heading: Our lawful basis
      lawful_basis_body: Our lawful basis is legitimate interests. Our interest is to run a fantasy game about public competitive results. We hold no data about you beyond the public record of your play.
      retention_heading: How long we keep your data
      retention_body: "[retention period for player data to be confirmed]"
      retention_import_logs_body: We keep a log of every import we run from an external service. The raw response in that log holds your name and your results. We keep the raw response for 24 hours after the import. A job that runs every hour then erases the raw response. We remove the whole log entry when we no longer need it.
      recipients_heading: Who receives your data
      recipients_body: "[Who receives this data, and where it is hosted, is still being decided and will be confirmed here before launch.]"
      transfers_heading: Transfers outside the UK
      transfers_body: "[Whether this data transfers outside the UK depends on the final hosting decision, and will be confirmed here before launch.]"
      rights_heading: Your rights
      rights_body: You have the right to access, correct, erase, and restrict your data. You also have the right to object to our use of it.
      rights_portability: Data portability is a right only where the processing rests on consent or on a contract, so it does not apply here. Write to us anyway and we will send you a copy of what we hold.
      object_heading: How to object, and what happens then
      object_route: Write to the contact address above and tell us that you object. We answer within one month.
      object_outcome: We then stop using your data, and we remove you from the site, unless we can show compelling legitimate grounds that override your rights.
      object_by_hand: We do this by hand at the moment. If your data comes back after a later import, tell us and we will remove it again.
      complaints_heading: How to complain
      complaints_ico: You can complain to the UK Information Commissioner's Office (ICO) at ico.org.uk.
      complaints_dpo: "[named data protection contact beyond the ICO to be confirmed]"
